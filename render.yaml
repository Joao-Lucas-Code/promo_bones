services:
  - type: web
    name: promo-bones
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: ML_AFFILIATE_TAG
        sync: false
      - key: AMAZON_AFFILIATE_TAG
        sync: false
      - key: SCRAPER_INTERVAL
        value: 60
