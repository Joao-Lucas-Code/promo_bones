name: Keep Render Alive

on:
  schedule:
    # Roda a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          set -e
          RENDER_URL="${{ secrets.RENDER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "Error: RENDER_URL secret is not set."
            echo "Configure it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/api/health")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Keep-alive failed!"
            exit 1
          fi
          echo "Keep-alive OK"
