<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Promo Bones{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-bg: #1a1a2e;
            --sidebar-active: #16213e;
            --accent: #e94560;
            --accent-hover: #d13650;
            --card-bg: #ffffff;
            --text-muted: #6c757d;
        }
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-bg);
            color: white;
            position: fixed;
            width: 260px;
            left: 0;
            top: 0;
            z-index: 1000;
            transition: all 0.3s;
        }
        .sidebar .brand {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
        }
        .sidebar .brand i {
            margin-right: 0.5rem;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.75);
            padding: 0.85rem 1.5rem;
            border-radius: 0;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: white;
            background: var(--sidebar-active);
            border-left-color: var(--accent);
        }
        .sidebar .nav-link i {
            width: 24px;
            margin-right: 0.5rem;
        }
        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .stat-card .icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        .btn-accent {
            background: var(--accent);
            border: none;
            color: white;
        }
        .btn-accent:hover {
            background: var(--accent-hover);
            color: white;
        }
        .product-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
            background: white;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .product-card .body {
            padding: 1rem;
        }
        .badge-discount {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            font-weight: 600;
        }
        .price-old {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        .price-current {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2ecc71;
        }
        .telegram-preview {
            background: #0d1117;
            color: #c9d1d9;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'SF Mono', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            border: 1px solid #30363d;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-online { background: #2ecc71; }
        .status-offline { background: #e74c3c; }
        .status-warning { background: #f39c12; }
        @media (max-width: 991px) {
            .sidebar { width: 100%; position: relative; min-height: auto; }
            .main-content { margin-left: 0; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="sidebar d-none d-lg-block">
        <div class="brand">
            <i class="bi bi-shop"></i> Promo Bones
        </div>
        <div class="nav flex-column">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/sites" class="nav-link {% if request.path == '/sites' %}active{% endif %}">
                <i class="bi bi-globe"></i> Sites
            </a>
            <a href="/products" class="nav-link {% if request.path == '/products' %}active{% endif %}">
                <i class="bi bi-box-seam"></i> Produtos
            </a>
            <a href="/coupons" class="nav-link {% if request.path == '/coupons' %}active{% endif %}">
                <i class="bi bi-ticket-perforated"></i> Cupons
            </a>
            <a href="/messages" class="nav-link {% if request.path == '/messages' %}active{% endif %}">
                <i class="bi bi-send"></i> Mensagens
            </a>
        </div>
        <div class="mt-auto p-3 text-muted" style="font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.1);">
            v{{ version }}
        </div>
    </nav>

    <!-- Mobile nav -->
    <nav class="navbar navbar-dark d-lg-none" style="background: var(--sidebar-bg);">
        <div class="container-fluid">
            <span class="navbar-brand text-accent"><i class="bi bi-shop"></i> Promo Bones</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mobileNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sites">Sites</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/coupons">Cupons</a></li>
                    <li class="nav-item"><a class="nav-link" href="/messages">Mensagens</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
